<script>
  function esc(s) {
    return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function fmtDate(iso) {
    if (!iso) return '';
    try {
      var jst = new Date(new Date(iso).getTime() + 9 * 60 * 60 * 1000);
      return jst.getUTCFullYear() + '.' +
        String(jst.getUTCMonth() + 1).padStart(2, '0') + '.' +
        String(jst.getUTCDate()).padStart(2, '0');
    } catch(e) { return ''; }
  }

  var allVideos = [];
  var filteredVideos = [];
  var shown = 0;
  var BATCH_SIZE = 6;
  var currentCat = 'ALL';

  function videoCardHTML(v) {
    var relHtml = '';
    if (v.related_articles && v.related_articles.length) {
      relHtml = '<div class="video-related"><div class="video-related-label">RELATED ARTICLES</div>' +
        v.related_articles.map(function(r) {
          return '<a href="../article.html?id=' + encodeURIComponent(r.id) + '">' + esc(r.title) + '</a>';
        }).join('') + '</div>';
    }

    var pickBadge = v.editor_pick ? '<span class="editor-pick">EDITOR\'S PICK</span>' : '';

    return '<div class="video-card" data-cat="' + esc(v.category) + '">' +
      '<lite-youtube videoid="' + esc(v.id) + '" playlabel="Play" loading="lazy"></lite-youtube>' +
      '<div class="video-card-body">' +
        '<div class="video-card-cat">' + esc(v.category) + pickBadge + '</div>' +
        '<div class="video-card-title">' + esc(v.title) + '</div>' +
        '<div class="video-card-meta">' +
          '<span class="video-card-channel">' + esc(v.channel_name) + '</span> · ' + fmtDate(v.published_at) +
        '</div>' +
        relHtml +
      '</div>' +
    '</div>';
  }

  function renderBatch() {
    var grid = document.getElementById('videoGrid');
    var batch = filteredVideos.slice(shown, shown + BATCH_SIZE);
    grid.insertAdjacentHTML('beforeend', batch.map(videoCardHTML).join(''));
    shown += batch.length;
    document.getElementById('videoMore').style.display = shown < filteredVideos.length ? '' : 'none';
  }

  function applyFilter(cat) {
    currentCat = cat;
    filteredVideos = cat === 'ALL'
      ? allVideos
      : allVideos.filter(function(v) { return v.category === cat; });
    shown = 0;
    document.getElementById('videoGrid').innerHTML = '';

    if (filteredVideos.length === 0) {
      document.getElementById('videoGrid').innerHTML = '<div class="empty-state">動画はありません</div>';
      document.getElementById('videoMore').style.display = 'none';
    } else {
      renderBatch();
    }

    document.querySelectorAll('.watch-tab').forEach(function(t) {
      t.classList.toggle('is-active', t.dataset.cat === cat);
    });
  }

  function renderTabs(videos) {
    var cats = ['ALL'];
    var catSet = {};
    videos.forEach(function(v) {
      if (v.category && !catSet[v.category]) {
        catSet[v.category] = true;
        cats.push(v.category);
      }
    });

    var tabsEl = document.getElementById('watchTabs');
    tabsEl.innerHTML = cats.map(function(c) {
      var label = c === 'ALL' ? 'ALL' : c;
      return '<div class="watch-tab' + (c === 'ALL' ? ' is-active' : '') + '" data-cat="' + esc(c) + '" onclick="applyFilter(\'' + esc(c) + '\')">' + esc(label) + '</div>';
    }).join('');
  }

  async function init() {
    try {
      var res = await fetch('../data/videos.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var data = await res.json();
      allVideos = data.videos || [];

      if (allVideos.length === 0) {
        document.getElementById('videoGrid').innerHTML = '<div class="empty-state">動画はまだありません。次回の自動更新で追加されます。</div>';
        return;
      }

      renderTabs(allVideos);
      filteredVideos = allVideos;
      renderBatch();
    } catch(e) {
      console.error('videos.json の読み込みに失敗:', e);
      document.getElementById('videoGrid').innerHTML = '<div class="empty-state">動画データの読み込みに失敗しました</div>';
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    init();
    document.getElementById('videoMoreBtn').addEventListener('click', renderBatch);
  });

  function toggleNav() {
    document.getElementById('mobileNav').classList.toggle('open');
  }
</script>
